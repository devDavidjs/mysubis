<!doctype html>
<html lang="fr" data-lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Page technique (liens des e-mails) : jamais indexée, jamais intégrée, aucune fuite de référent. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://ozfxhosqbnwaicwtekuk.supabase.co; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; manifest-src 'none'; worker-src 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="theme-color" content="#09090b" />
  <meta name="format-detection" content="telephone=no, email=no" />
  <title>Confirmation de l'e-mail — MySubis</title>
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body data-page="confirm">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22.37" fill="#2EE6A8" />
      <path d="M26 68 V44 A12 12 0 0 1 50 44 V68 M50 44 A12 12 0 0 1 74 44 V68" fill="none" stroke="#09090B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="70.5" cy="35.5" r="10.5" fill="#2EE6A8" />
      <circle cx="70.5" cy="35.5" r="5.5" fill="#FFFFFF" />
    </symbol>
    <symbol id="moon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-7.54-7.54c-.44-.06-.9-.1-1.36-.1z"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></g></symbol>
  </svg>

  <header class="nav">
    <div class="container nav__inner">
      <span class="brand"><svg class="brand__mark" aria-hidden="true"><use href="#logo" /></svg> MySubis</span>
      <div class="nav__tools">
        <button type="button" class="toggle" data-lang-toggle aria-label="Changer de langue / Change language">EN</button>
        <button type="button" class="toggle" data-theme-toggle aria-label="Changer de thème / Toggle theme">
          <svg class="moon" aria-hidden="true"><use href="#moon" /></svg>
          <svg class="sun" aria-hidden="true"><use href="#sun" /></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="auth">
    <div class="auth__card">
      <svg class="auth__logo" aria-hidden="true"><use href="#logo" /></svg>
      <h1><span class="lang-fr">Confirmation de l'e-mail</span><span class="lang-en">Email confirmation</span></h1>
      <p id="status" class="auth__status" role="status" aria-live="polite" hidden></p>
      <a id="open-app" class="btn btn--primary auth__cta" href="mysubis://" hidden><span class="lang-fr">Ouvrir MySubis</span><span class="lang-en">Open MySubis</span></a>
    </div>
    <noscript><p class="auth__status" data-tone="error">Activez JavaScript pour continuer. / Please enable JavaScript to continue.</p></noscript>
  </main>

  <script src="../script.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
